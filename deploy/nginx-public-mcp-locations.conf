    # --- public informational MCP (smartypos-public-mcp -> 127.0.0.1:8140), read-only, no auth
    location = /mcp/ { rewrite ^ /mcp last; }
    location = /mcp {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization, Mcp-Session-Id, Mcp-Protocol-Version, Last-Event-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Mcp-Session-Id, Mcp-Protocol-Version" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        limit_req zone=public_mcp burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8140/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location = / {
        add_header Access-Control-Allow-Origin "*" always;
        limit_req zone=public_mcp burst=10 nodelay;
        proxy_pass http://127.0.0.1:8140/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

